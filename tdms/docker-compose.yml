version: "3.9"
services:
  mysql:
    image: mysql:8.3
    container_name: tdms-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: tdms
      MYSQL_USER: tdms_user
      MYSQL_PASSWORD: tdms123
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: